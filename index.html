<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Observatoire Madagascar</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230E2438'/><circle cx='16' cy='13' r='6.5' fill='%23F3EAD3'/><path d='M16 30 L8.5 18 h15z' fill='%23F3EAD3'/><circle cx='16' cy='13' r='2.8' fill='%23B2342C'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* Observatoire Madagascar : coque de la page de l'artifact. Système visuel du dashboard Pilotage, sans son rail.
   Les vues des onglets vivent dans vues_a.js et vues_b.js ; ce fichier porte la couche de données OBS et le routeur. */
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8EDF2; --ink:#0E2438; --ink-2:#3B5064; --muted:#5B6472;
  --line:#D5DCE3; --line-strong:#B3C0CC;
  --gold:#94701A; --gold-ink:#C9A24F; --gold-soft:#F3EAD3;
  --crit:#B2342C; --crit-soft:#F7E0DE; --warn:#975B0C; --warn-soft:#F6E8D3; --good:#2B7149; --good-soft:#DCEFE3;
  --wait:#5A4FA0; --wait-soft:#E7E3F6; --info:#245E8F; --info-soft:#DDE9F4;
  --s-fact:#245E8F; --s-enc:#2B7149; --s-cible:#A67C1E;
  --shadow:0 1px 2px rgba(14,36,56,.06),0 8px 22px rgba(14,36,56,.07);
  --display:'Spectral',Georgia,'Times New Roman',serif;
  --ui:'Archivo','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,'Liberation Mono',monospace;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0A1520; --surface:#101E2C; --surface-2:#172A3B; --ink:#E6ECF2; --ink-2:#B9C7D4; --muted:#8FA2B4;
    --line:#213649; --line-strong:#33506A;
    --gold:#D8B35E; --gold-ink:#D8B35E; --gold-soft:#3A2F15;
    --crit:#F0857B; --crit-soft:#43201F; --warn:#E5AA52; --warn-soft:#3E2E14; --good:#6FC795; --good-soft:#173527;
    --wait:#B3A8F0; --wait-soft:#29244A; --info:#86B9E8; --info-soft:#15304A;
    --s-fact:#5FA3E0; --s-enc:#5FBF8A; --s-cible:#D8B35E;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0A1520; --surface:#101E2C; --surface-2:#172A3B; --ink:#E6ECF2; --ink-2:#B9C7D4; --muted:#8FA2B4;
  --line:#213649; --line-strong:#33506A;
  --gold:#D8B35E; --gold-ink:#D8B35E; --gold-soft:#3A2F15;
  --crit:#F0857B; --crit-soft:#43201F; --warn:#E5AA52; --warn-soft:#3E2E14; --good:#6FC795; --good-soft:#173527;
  --wait:#B3A8F0; --wait-soft:#29244A; --info:#86B9E8; --info-soft:#15304A;
  --s-fact:#5FA3E0; --s-enc:#5FBF8A; --s-cible:#D8B35E;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15;color:var(--ink)}
h1{font-size:1.7rem} h2{font-size:1.28rem} h3{font-size:1.06rem} h4{font-size:.92rem;font-family:var(--ui)}
p{margin:0}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px}
sup{font-size:.7em;line-height:0}

/* ---------- ossature : une colonne, gouttière sûre ---------- */
main.page{padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto;min-width:0}
@media (min-width:781px){main.page{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.topbar .t{min-width:0}
.topbar .t p{color:var(--muted);margin-top:4px;max-width:68ch}
.topbar .etat{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.syncline{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.live{background:#4CC27F} .dot.ro{background:#E5AA52} .dot.off{background:var(--crit)}
.bandeau{margin:0 0 12px}
.onglets{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:4px 0 12px;align-items:center;overflow-x:auto;scrollbar-width:none}
.onglets::-webkit-scrollbar{display:none}
.onglets button{border:0;background:transparent;color:var(--muted);padding:8px 12px;font-size:.86rem;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px;display:flex;gap:6px;align-items:center;white-space:nowrap;border-radius:0}
.onglets button:hover{color:var(--ink)}
.onglets button.on{color:var(--ink);border-bottom-color:var(--ink)}
.onglets .n{font-size:.68rem;background:var(--surface-2);border-radius:999px;padding:1px 7px;color:var(--muted)}
.onglets .n.hot{background:var(--crit-soft);color:var(--crit)}
.onglets .fin{margin-left:auto;display:flex;gap:6px}
.pied{margin-top:28px;font-size:.74rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap}

/* ---------- éléments communs ---------- */
.btn{border:1px solid var(--line-strong);background:var(--surface);padding:7px 12px;border-radius:7px;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.primary:hover{filter:brightness(1.15)}
.btn.sm{padding:4px 9px;font-size:.79rem;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.71rem;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.01em;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.wait{background:var(--wait-soft);color:var(--wait)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.gold{background:var(--gold-soft);color:var(--gold)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px;min-width:0}
.card.lift{box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card .hd .more{font-size:.78rem;color:var(--muted)}
.kpi{display:flex;flex-direction:column;gap:5px;padding:14px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi .k{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--display);font-size:1.5rem;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v small{font-size:.95rem;color:var(--muted);font-weight:500}
.kpi .l{font-size:.8rem;color:var(--ink-2)}
.kpi .delta{font-size:.74rem;color:var(--muted)} .kpi .delta b{font-weight:600}
.kpi.alert{border-color:var(--crit)} .kpi.alert .v{color:var(--crit)}
.up{color:var(--crit)} .dn{color:var(--good)} .eq{color:var(--muted)}
.section{margin-top:24px}
.section>h2{margin-bottom:10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section>h2 .sub{font-family:var(--ui);font-size:.8rem;color:var(--muted);font-weight:400}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.row:hover{border-color:var(--line-strong)}
.row .ttl{font-weight:500;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:5px 10px;font-size:.77rem;color:var(--muted);margin-top:4px;align-items:center}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 6px;font-size:.78rem;max-width:100%}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted);cursor:pointer;user-select:none}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.num.neg{color:var(--crit)}
.twrap{overflow-x:auto;max-width:100%}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);overflow-wrap:anywhere}
.empty b{color:var(--ink)}
.callout{padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--surface)}
.callout.crit{border-left-color:var(--crit)} .callout.info{border-left-color:var(--info)} .callout.good{border-left-color:var(--good)} .callout.gold{border-left-color:var(--gold-ink)}
.callout b{display:block;margin-bottom:3px}
.callout p+p{margin-top:5px}
.path{font-family:var(--mono);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.journal .e{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.journal .e .d{font-family:var(--mono);font-size:.74rem;color:var(--muted);padding-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(6,15,24,.5);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(660px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px 22px;box-shadow:var(--shadow)}
.modal h2{margin-bottom:12px}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600}
.form input,.form select,.form textarea{border:1px solid var(--line-strong);border-radius:7px;padding:7px 10px;background:var(--surface);font-weight:400;color:var(--ink);width:100%}
.form textarea{min-height:70px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .chk{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:.86rem;color:var(--ink)}
.form .chk input{width:auto}
.form .hint{font-weight:400;color:var(--muted)}
.modal .foot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 15px;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.copyblock{font-family:var(--mono);font-size:.78rem;white-space:pre-wrap;background:var(--surface-2);padding:10px;border-radius:8px;max-height:280px;overflow:auto}
.dim{color:var(--muted)}
.small{font-size:.8rem}
.mt{margin-top:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.pair{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;font-size:.86rem}
.pair dt{color:var(--muted)} .pair dd{margin:0;overflow-wrap:anywhere}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.subtabs button:hover{border-color:var(--line-strong);color:var(--ink)}
.subtabs button.on{background:var(--gold-soft);color:var(--gold-ink);border-color:var(--gold-ink);font-weight:600}

/* ---------- composants de l'observatoire (maquettes v3 et v4) ---------- */
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--ink-2);margin:0 0 4px} .strip b{color:var(--ink)}
.depuis{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--muted);margin:0 0 10px} .depuis a,.depuis button.lien{color:var(--ink);font-weight:600;text-decoration:none;border:0;background:transparent;padding:0;border-bottom:1px dotted var(--line)}
.coup{font-size:.9rem;line-height:1.5;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:8px;margin-bottom:12px}
.deux{display:grid;grid-template-columns:7fr 5fr;gap:12px;align-items:start;margin-bottom:12px} .pile{display:grid;gap:12px}
.deux4{display:grid;grid-template-columns:7fr 5fr;gap:12px;align-items:stretch;margin-bottom:12px} .deux4 .bloc{height:100%}
.bloc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0} .bloc h3{margin:0 0 6px;font-size:.92rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap} .bloc h3 .sub{font-weight:400;color:var(--muted);font-size:.75rem;margin-left:auto}
.bloc+.bloc{margin-top:10px}
.l{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:30px;padding:3px 4px;border-bottom:1px solid var(--line);font-size:.82rem} .l:last-child{border-bottom:0} .l .pic{letter-spacing:2px;white-space:nowrap} .l .t{font-weight:600;line-height:1.3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;overflow-wrap:anywhere} .l .t .chip{font-size:.66rem;padding:1px 6px} .l .s{font-size:.74rem;color:var(--muted);white-space:nowrap} .l .s .q{opacity:.75}
.l.clic{cursor:pointer} .l.clic:hover{background:var(--surface-2)}
/* cadres colorés par niveau (03/11/2026) : ce qui coince se voit avant de lire */
.l[data-niveau="urgent"]{box-shadow:inset 4px 0 0 var(--crit);padding-left:8px} .l[data-niveau="attention"]{box-shadow:inset 4px 0 0 var(--warn);padding-left:8px} .l[data-niveau="info"]{box-shadow:inset 4px 0 0 var(--info);padding-left:8px}
tr[data-niveau="urgent"]>td:first-child{box-shadow:inset 4px 0 0 var(--crit)} tr[data-niveau="attention"]>td:first-child{box-shadow:inset 4px 0 0 var(--warn)} tr[data-niveau="info"]>td:first-child{box-shadow:inset 4px 0 0 var(--info)}
.l2{grid-template-columns:40px minmax(0,1fr) auto;min-height:40px} .l2 .m{font-size:.74rem;color:var(--muted);margin-top:1px;font-weight:400}
.q{color:var(--muted);font-size:.8rem}
/* en sombre, l'émoji ❔ se rend blanc et gras : on l'atténue pour qu'il reste discret, comme la grille le veut */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .q{filter:grayscale(1) opacity(.55)}}
:root[data-theme="dark"] .q{filter:grayscale(1) opacity(.55)}
.kv{display:grid;grid-template-columns:22px 96px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--line)} .kv:last-child{border-bottom:0} .kv .k{color:var(--muted)} .kv .d{font-size:.7rem;color:var(--muted);white-space:nowrap}
.kv.deux-col{grid-template-columns:120px minmax(0,1fr)}
.zl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--line)} .zl:last-child{border-bottom:0} .zl b{font-weight:700} .zl .d{color:var(--muted);font-size:.7rem;white-space:nowrap}
.av{display:grid;grid-template-columns:78px minmax(0,1fr) auto;gap:8px;font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--line)} .av:last-child{border-bottom:0} .av .d{color:var(--muted);font-variant-numeric:tabular-nums} .av .rp{font-size:.7rem;color:var(--muted);white-space:nowrap}
.plus{font-size:.76rem;color:var(--muted);padding:6px 4px 0} .plus a,.plus button.lien{color:var(--ink);font-weight:600;border:0;background:transparent;padding:0;cursor:pointer;text-decoration:none}
.filtres{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px;font-size:.76rem;color:var(--muted)} .filtres .lbl{min-width:84px} .filtres .fg{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap} .filtres .f{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font-size:.74rem;cursor:pointer;white-space:nowrap} .filtres .f.on{background:var(--ink);color:var(--surface);border-color:var(--ink)} .filtres .sep{width:1px;height:18px;background:var(--line);margin:0 2px} .filtres input{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.74rem;width:190px;max-width:100%;background:var(--surface)}
table.ft{width:100%;border-collapse:collapse;font-size:.8rem;table-layout:fixed;margin-top:6px} table.ft th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 6px;border-bottom:1px solid var(--line)} table.ft td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere} table.ft tr.grp td{background:var(--surface-2);font-weight:600;padding:6px 8px;font-size:.84rem} table.ft tr.grp td .sub{font-weight:400;color:var(--muted);font-size:.72rem;margin-left:8px} table.ft td.d{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums} table.ft td.d small{display:block;font-size:.66rem} table.ft td .t{font-weight:600} table.ft td .m{font-size:.7rem;color:var(--muted);margin-top:1px} table.ft td.n{white-space:nowrap} table.ft tr.open td{background:var(--gold-soft)} table.ft tr.clic{cursor:pointer}
.det{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.82rem;line-height:1.5} .det .li{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:.76rem;color:var(--muted)} .det .maj{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;font-size:.78rem;padding:3px 0;border-bottom:1px dashed var(--line)} .det .btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center} .det .titre-maj{margin-top:8px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.crs{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px;align-items:start} .jour{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:6px;font-size:.8rem;cursor:pointer} .jour.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--ink)} .jour .d{font-weight:600} .jour .m{font-size:.72rem;color:var(--muted);margin-top:2px} .jour.off{opacity:.6}

  /* ---------- écritures : une à la fois, seulement sur changement, erreurs en français ---------- */
  function messageErreur(e) {

  O.reclasser = function (faitId, niveau, motif) {
    return ecrire(function () {
      var f = trouver(O.etat.faits, faitId); if (!f) throw new Error("Fait introuvable.");
      if (NIVEAUX.indexOf(niveau) < 0) throw new Error("Niveau inconnu : " + niveau);
      /* urgent seulement pour un fait établi ou recoupé (CONTRAT §4 ; décision du 02/11/2026 : contesté plafonne à attention) ;

      if (niveau === "urgent" && f.etat_recoupement === "divergent") throw new Error("Un fait contesté (deux sources en désaccord) ne passe pas urgent : tranche d’abord la divergence, avec motif.");
      if (niveau === "urgent" && f.etat_recoupement !== "officiel" && f.etat_recoupement !== "recoupe") throw new Error("Un fait signalé (une seule rédaction) ne passe pas urgent : attends un recoupement ou une source officielle.");

  /* relecture typée (lot 2) : un fait relu est confirmé, ou corrigé sur un chiffre, une date, un lieu, la formulation, l'attribution ou le niveau ;

  var TYPES_RELECTURE = ["chiffre", "date", "lieu", "formulation", "attribution", "niveau"];
  O.relire = function (faitId, verdict, note, type) {

      var r = { verdict: verdict, type: verdict === "corrige" ? type : null, quand: O.fmt.maintenant(), par: idSur(), note: String(note || "").slice(0, 300) };

  /* lot 2 : l'appel au service, enregistré sur le fait. Confirmé par un service du thème (annuaire settings.services) → établi ;

     Jamais un nom de personne : un service. */
  O.confirmerFait = function (faitId, c) {
    return ecrire(function () {
      var f = trouver(O.etat.faits, faitId); if (!f) throw new Error("Fait introuvable.");
      c = c || {};
      var moyen = ["appel", "page", "terrain"].indexOf(c.moyen) >= 0 ? c.moyen : "appel", resultat = ["confirme", "infirme", "sans_reponse"].indexOf(c.resultat) >= 0 ? c.resultat : null;
      var service = String(c.service || "").trim().slice(0, 80), note = String(c.note || "").trim().slice(0, 200);
      if (!resultat) throw new Error("Résultat attendu : confirmé, infirmé ou sans réponse.");
      if (!service) throw new Error("Le service joint est à nommer (un service, jamais une personne).");
      var quand = O.fmt.maintenant(), par = idSur();
      var annuaire = (O.etat.settings && O.etat.settings.services) || SETTINGS_DEFAUT.services || {};
      var officiel = (annuaire[f.theme] || []).some(function (s) { return String(s).trim().toLowerCase() === service.toLowerCase(); });
      var entree = { quand: quand, par: par, moyen: moyen, service: service, resultat: resultat, note: note, officiel: officiel };
      var maj = { confirmations_humaines: (f.confirmations_humaines || []).concat([entree]), maj_le: quand };
      if (resultat === "confirme") {
        var src = { nom: service, url: (moyen === "terrain" ? "terrain://" : "appel://") + cle(quand), date_pub: quand, extrait: note || ("confirmé par " + service), relais: false, origine: service, type: moyen === "terrain" ? "terrain" : "appel", officiel: officiel };
        maj.sources = (f.sources || []).concat([src]);
        maj.mises_a_jour = (f.mises_a_jour || []).concat([{ date: quand.slice(0, 10), texte: "confirmé par " + service + " (" + (moyen === "appel" ? "appel" : moyen === "page" ? "page du service" : "terrain") + ")", source_url: src.url }]);
        if (officiel) maj.etat_recoupement = "officiel";
        else if (f.etat_recoupement === "source_unique" || f.etat_recoupement === "terrain" || !f.etat_recoupement) maj.etat_recoupement = "recoupe";
        maj.origines = (O.nb(f.origines) || 1) + 1;
        maj.confirmation = Object.assign({}, f.confirmation || {}, { recoupe_le: quand, par_service: service });
      } else if (resultat === "infirme") {
        maj.etat_recoupement = "divergent";
        maj.divergences = (f.divergences || []).concat([{ champ: "fait", valeurs: [{ valeur: "rapporté", source: (f.sources && f.sources[0] && (f.sources[0].origine || f.sources[0].nom)) || "presse" }, { valeur: "infirmé le " + quand.slice(0, 10), source: service }] }]);
        if (f.niveau === "urgent") maj.niveau = "attention";
      }
      if (apercu) { Object.assign(f, maj); return true; }
      return avecReprise(function () { return db.doc("faits/" + faitId).update(maj); }).then(function () { return true; });
    });
  };
  O.majZone = function (id, champs) {
    return ecrire(function () {
      if (!O.etat.peutEditer) throw new Error("Réservé à qui peut modifier la page.");
      if (!/^[A-Za-z0-9_-]{1,60}$/.test(String(id || ""))) throw new Error("Identifiant de zone invalide.");
      var c = {}; CHAMPS_ZONE.forEach(function (k) { if (champs && Object.prototype.hasOwnProperty.call(champs, k)) c[k] = champs[k]; });
      if ("etat" in c && ETATS_ZONE.indexOf(c.etat) < 0) throw new Error("État de zone inconnu : " + c.etat);
      if ("type" in c && TYPES_ZONE.indexOf(c.type) < 0) throw new Error("Type de zone attendu : ville, axe, region ou port.");
      if ("nom" in c && (!String(c.nom).trim() || nomZoneRefuse(c.nom))) throw new Error("Une zone est une ville, un axe ou une région : jamais une commune ni un quartier.");
      if ("suivi" in c) c.suivi = !!c.suivi;
      var z = trouver(O.etat.zones, id);
      var inchange = z && Object.keys(c).every(function (k) { return JSON.stringify(z[k]) === JSON.stringify(c[k]); });
      if (!Object.keys(c).length || inchange) return false;
      c.maj_le = O.fmt.maintenant();
      var neuf = Object.assign({ id: id, nom: id, type: "ville", etat: "inconnu", etat_libelle: "", dernier_fait_id: null, suivi: true, ordre: 99 }, c);
      if (apercu) { if (z) Object.assign(z, c); else O.etat.zones.push(neuf); return true; }
      return avecReprise(function () { return z ? db.doc("zones/" + id).update(c) : db.doc("zones/" + id).set(neuf); }).then(function () { return true; });
    });

  O.majSettings = function (champs) {
    return ecrire(function () {
      if (!O.etat.peutEditer) throw new Error("Réservé à qui peut modifier la page.");
      var c = {}; CLES_SETTINGS.forEach(function (k) { if (champs && Object.prototype.hasOwnProperty.call(champs, k)) c[k] = champs[k]; });
      if ("plafond_alertes" in c && !(c.plafond_alertes >= 0 && c.plafond_alertes <= 20)) throw new Error("Plafond d’alertes entre 0 et 20.");
      if ("zones_suivies" in c && !Array.isArray(c.zones_suivies)) throw new Error("zones_suivies doit être une liste d’identifiants.");

  O.marquerRelu = function (date) {

      if (cr.relu_par) return false;

  /* lot 4 (03/11/2026) : la fiche de contournement d'une zone (contournements/<zone>), écrite depuis Tendances par qui peut écrire ;

  O.majContournement = function (zoneId, texte) {

  /* ---------- lectures ---------- */
  function docs(snap) { return snap.docs.filter(function (d) { return d.exists; }).map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }
  function finChargement() { if (!O.etat.chargement) return; O.etat.chargement = false; clearTimeout(minuterie); }
  function abonner(nom, requete, appliquer) {
    try {
      abonnements.push(requete.onSnapshot(function (snap) {
        appliquer(snap); delete O.etat.erreurs[nom];
        if (!snap.metadata || !snap.metadata.fromCache) { definitif[nom] = true; if (nom === "faits") { O.etat.delai = false; finChargement(); } }
        O.rafraichir();
      }, function (e) { O.etat.erreurs[nom] = messageErreur(e); if (nom === "faits") finChargement(); O.rafraichir(); }));
    } catch (e) { O.etat.erreurs[nom] = messageErreur(e); O.rafraichir(); }
  }
  function triSeries(a, b) { return String(a.lundi || a.id) < String(b.lundi || b.id) ? -1 : 1; }
  function triZones(a, b) { return (a.ordre || 0) - (b.ordre || 0) || String(a.nom || "").localeCompare(String(b.nom || ""), "fr"); }
  function lireBase() {
    var auj = O.fmt.auj();
    abonner("faits", db.collection("faits").where("statut", "in", ["actif", "termine"]).orderBy("date_fait", "desc").limit(400), function (s) { O.etat.faits = docs(s); });
    abonner("comptes_rendus", db.collection("comptes_rendus").orderBy("date", "desc").limit(30), function (s) { O.etat.comptesRendus = docs(s); });
    abonner("etat", db.collection("etat"), function (s) { var o = {}; s.docs.forEach(function (d) { if (d.exists) o[d.id] = Object.assign({ id: d.id }, d.data()); }); O.etat.etat = o; });
    abonner("zones", db.collection("zones"), function (s) { O.etat.zones = docs(s).sort(triZones); });
    abonner("echeances", db.collection("echeances").where("date", ">=", auj).orderBy("date", "asc").limit(100), function (s) { O.etat.echeances = docs(s); });
    abonner("series", db.collection("series").orderBy("lundi", "desc").limit(26), function (s) { O.etat.series = docs(s).map(function (x) { x.semaine = x.semaine || x.id; return x; }).sort(triSeries); });
    abonner("journal", db.collection("journal").orderBy("debut", "desc").limit(10), function (s) { O.etat.journal = docs(s); });
    abonner("contournements", db.collection("contournements"), function (s) { O.etat.contournements = docs(s); });
    abonner("officiel", db.collection("officiel"), function (s) { O.etat.officiel = docs(s); }); /* lot 9 : fiches météo et aérien, lecture seule (vide dans l'artifact, remplie sur la page en ligne) */
    abonner("meta/settings", db.doc("meta/settings"), function (s) { O.etat.settings = s.exists ? Object.assign({ id: s.id }, s.data()) : null; });
    minuterie = setTimeout(function () { if (O.etat.chargement) { O.etat.chargement = false; O.etat.delai = true; O.rafraichir(); } }, 10000);
  }
  /* l'aperçu donne chaque collection soit en liste de documents (avec id), soit en objet par clé : on accepte les deux */
  function parId(v) { var o = {}; if (Array.isArray(v)) v.forEach(function (d) { if (d && d.id) o[d.id] = Object.assign({}, d); }); else if (v && typeof v === "object") Object.keys(v).forEach(function (k) { o[k] = Object.assign({ id: k }, v[k]); }); return o; }
  function chargerApercu() {
    var A = window.OBS_APERCU;
    if (!A) { O.etat.source = "aucune"; O.etat.chargement = false; O.etat.erreurs["aperçu"] = "apercu.js absent ou sans window.OBS_APERCU."; return; }
    O.etat.source = "apercu"; apercu = true;
    var auj = O.fmt.auj();
    O.etat.faits = (A.faits || []).map(function (f) { return Object.assign({}, f); }).filter(O.statutVisible).sort(function (a, b) { return String(b.date_fait) < String(a.date_fait) ? -1 : 1; });
    O.etat.comptesRendus = (A.comptes_rendus || []).map(function (c) { return Object.assign({ id: c.id || c.date }, c); }).sort(function (a, b) { return String(b.date) < String(a.date) ? -1 : 1; });
    O.etat.etat = parId(A.etat);
    /* etat/dernier_passage porte en corps l'id du passage (p_…) : dans la liste d'aperçu il se reconnaît à son type et à sa fin */
    if (!O.etat.etat.dernier_passage) Object.keys(O.etat.etat).forEach(function (k) { var d = O.etat.etat[k]; if (/^p_/.test(k) && d.fin && /^(matin|jour|soir|lundi|midi|manuel)$/.test(String(d.type))) O.etat.etat.dernier_passage = d; });
    O.etat.zones = (A.zones || []).map(function (z) { return Object.assign({}, z); }).sort(triZones);
    O.etat.echeances = (A.echeances || []).map(function (e) { return Object.assign({}, e); }).filter(function (e) { return String(e.date || "") >= auj; }).sort(function (a, b) { return String(a.date) < String(b.date) ? -1 : 1; });
    O.etat.series = (A.series || []).map(function (s) { return Object.assign({ id: s.id || s.semaine, semaine: s.semaine || s.id }, s); }).sort(triSeries);
    O.etat.journal = (A.journal || []).map(function (j) { return Object.assign({}, j); }).sort(function (a, b) { return String(b.debut || b.id) < String(a.debut || a.id) ? -1 : 1; });
    O.etat.contournements = (A.contournements || []).map(function (c) { return Object.assign({}, c); });
    O.etat.officiel = (A.officiel || []).map(function (d) { return Object.assign({}, d); });
    var meta = parId(A.meta);
    O.etat.settings = meta.settings ? meta.settings : (A.meta && !Array.isArray(A.meta) && A.meta.cadence ? Object.assign({ id: "settings" }, A.meta) : Object.assign({ id: "settings" }, SETTINGS_DEFAUT));
    O.etat.user = { id: "u_apercu", name: "", isOwner: true, canEdit: true };
    uid = "u_apercu"; O.etat.peutEditer = true; O.etat.peutEcrire = true; O.etat.enLigne = false; O.etat.chargement = false;
  }
  function attendre(p, ms, defaut) { return Promise.race([p, new Promise(function (r) { setTimeout(function () { r(defaut); }, ms); })]).catch(function () { return defaut; }); }

  O.init = async function () {
    prefsV = lsGet();
    window.addEventListener("hashchange", function () { lireRoute(); O.prefs.set("onglet", O.etat.route.onglet); O.rafraichir(); });
    document.getElementById("onglets").addEventListener("click", function (ev) { var b = ev.target.closest("button[data-onglet]"); if (b) O.naviguer(b.getAttribute("data-onglet")); });

    if (!window.claude || typeof window.claude.use !== "function") { O.etat.source = "aucune"; O.etat.chargement = false; O.rendre(); return; }
    db = await claude.use("db");
    user = await claude.use("user");
    if (!db) { O.etat.source = "aucune"; O.etat.chargement = false; O.rendre(); return; }
    O.etat.source = "db"; O.etat.enLigne = true;
    if (user) {
      var me = await attendre(user.me(), 4000, null);
      uid = me && me.id ? me.id : null;
      var peutEcrire = await attendre(user.can("data.write"), 4000, null);
      O.etat.peutEcrire = peutEcrire !== false;
      O.etat.peutEditer = me ? !!me.canEdit : false;
      O.etat.user = me ? { id: uid, name: me.name || "", isOwner: !!me.isOwner, canEdit: !!me.canEdit } : null;
    } else { O.etat.peutEcrire = true; O.etat.peutEditer = false; }
    if (uid) {
      var snap = await attendre(db.doc("data/users/" + uid + "/prefs").get(), 3000, null);
      if (snap && snap.exists) { prefsV = Object.assign({}, prefsV, snap.data()); lsSet(prefsV); }
    }
    lireBase();
    O.rendre();
  };
  O.demarrer = function () {
    if (location.protocol === "file:" && !window.OBS_APERCU) {
      var s = document.createElement("script"); s.src = "apercu.js";
      s.onload = function () { O.init(); }; s.onerror = function () { O.init(); };
      document.body.appendChild(s);
    } else O.init();
  };
  O.arreter = function () { abonnements.forEach(function (u) { try { u(); } catch (e) { } }); abonnements = []; };
  return O;
})();

<script>
/* donnees.js — couche de données de la page en ligne (lot 6, 03/11/2026).
   Imite la base de l'artifact telle que la coque OBS l'emploie (collection().where().orderBy().limit().onSnapshot(), doc().get/set/update)
   au-dessus de deux fonds : la copie Supabase (lecture des tables, écriture par la fonction page_ecrire, journalisée pour la reprise
   par la routine) et la mémoire (jeu d'aperçu, banc : ?apercu=1). La coque n'est pas modifiée : window.claude.use est imité par brancher(). */
window.OBS_DONNEES = (function () {
  "use strict";
  var COLONNES = { faits: ["niveau", "theme", "statut", "etat_recoupement", "date_fait", "maj_le"], zones: ["etat", "type", "maj_le"], journal: ["type", "debut", "hashes_ok"], series: ["lundi"], echeances: ["date"], articles: ["statut", "lu_le"] };
  var TABLES = ["faits", "zones", "etat", "journal", "comptes_rendus", "series", "echeances", "contournements", "corrections", "meta", "articles", "officiel"];
  var PERIODE_MS = 90000; /* relecture périodique : la copie Supabase avance à chaque passage de la routine, et après chaque écriture de la page */

  function snapshotDocs(rows) { return { docs: rows.map(function (r) { var d = Object.assign({}, r.doc || {}); return { id: r.id, exists: true, data: function () { return d; } }; }), metadata: { fromCache: false } }; }
  function snapshotDoc(id, row) { var d = row ? Object.assign({}, row.doc || {}) : null; return { id: id, exists: !!row, data: function () { return d; }, metadata: { fromCache: false } }; }
  function cheminDoc(chemin) { var p = String(chemin || "").split("/"); return { table: p[0], id: p.slice(1).join("/"), local: p[0] === "data" }; }

  /* ---------- fond Supabase ---------- */
  function fondSupabase(sb) {
    function colonne(table, champ) { return (COLONNES[table] || []).indexOf(champ) >= 0 ? champ : "doc->>" + champ; }
    return {
      nom: "supabase",
      lister: function (table, filtres, tri, max) {
        if (TABLES.indexOf(table) < 0) return Promise.reject(new Error("collection inconnue : " + table));
        var q = sb.from(table).select("id,doc,version");
        filtres.forEach(function (f) {
          var c = colonne(table, f[0]), op = f[1], v = f[2];
          if (op === "in") q = q.in(c, v);
          else if (op === "not-in") q = q.not(c, "in", "(" + [].concat(v).map(function (x) { return JSON.stringify(String(x)); }).join(",") + ")");
          else if (op === "==" || op === "eq") q = q.eq(c, v);
          else if (op === "!=" || op === "ne") q = q.neq(c, v);
          else if (op === ">=" || op === "gte") q = q.gte(c, v);
          else if (op === ">" || op === "gt") q = q.gt(c, v);
          else if (op === "<=" || op === "lte") q = q.lte(c, v);
          else if (op === "<" || op === "lt") q = q.lt(c, v);
          else if (op === "array-contains") q = q.contains("doc->" + f[0], JSON.stringify([v]));
        });
        if (tri) q = q.order(colonne(table, tri[0]), { ascending: tri[1] !== "desc", nullsFirst: false });
        if (max) q = q.limit(max);
        return q.then(function (r) { if (r.error) throw erreurDe(r.error, "lecture impossible"); return r.data || []; });
      },
      lire: function (table, id) {
        if (TABLES.indexOf(table) < 0) return Promise.reject(new Error("collection inconnue : " + table));
        return sb.from(table).select("id,doc,version").eq("id", id).maybeSingle().then(function (r) { if (r.error) throw erreurDe(r.error, "lecture impossible"); return r.data || null; });
      },
      ecrire: function (table, id, patch, remplacer) {
        return sb.rpc("page_ecrire", { p_table: table, p_id: id, p_patch: patch, p_remplacer: !!remplacer }).then(function (r) { if (r.error) throw erreurDe(r.error, "écriture impossible"); return r.data; });
      },
      personnes: function (ids) {
        return sb.from("personnes").select("id,nom").in("id", ids).then(function (r) { var o = {}; (r.data || []).forEach(function (p) { o[p.id] = { name: p.nom }; }); return o; });
      }
    };
  }

  /* ---------- fond mémoire (banc, jeu d'aperçu) ---------- */
  function fondMemoire(A) {
    var tables = {};
    function parId(v, cleId) { var o = {}; if (Array.isArray(v)) v.forEach(function (d) { var k = d && (d.id || d[cleId]); if (k) o[k] = Object.assign({}, d); }); else if (v && typeof v === "object") Object.keys(v).forEach(function (k) { o[k] = Object.assign({ id: k }, v[k]); }); return o; }
    TABLES.forEach(function (t) { tables[t] = parId(A[t], t === "comptes_rendus" ? "date" : t === "series" ? "semaine" : t === "contournements" ? "zone" : "id"); });
    if (A.meta && !Array.isArray(A.meta) && A.meta.cadence) tables.meta = { settings: Object.assign({ id: "settings" }, A.meta) };
    function garde(f) {
      var champ = f[0], op = f[1], v = f[2];
      return function (d) {
        var x = d[champ];
        if (op === "in") return v.indexOf(x) >= 0; if (op === "not-in") return v.indexOf(x) < 0;
        if (op === "==" || op === "eq") return x === v; if (op === "!=" || op === "ne") return x !== v;
        if (op === ">=" || op === "gte") return x >= v; if (op === ">" || op === "gt") return x > v; if (op === "<=" || op === "lte") return x <= v; if (op === "<" || op === "lt") return x < v;
        if (op === "array-contains") return Array.isArray(x) && x.indexOf(v) >= 0;
        return true;
      };
    }
    return {
      nom: "memoire",
      lister: function (table, filtres, tri, max) {
        var l = Object.keys(tables[table] || {}).map(function (k) { return { id: k, doc: tables[table][k], version: 1 }; });
        filtres.forEach(function (f) { var g = garde(f); l = l.filter(function (r) { return g(r.doc); }); });
        if (tri) l.sort(function (a, b) { var x = a.doc[tri[0]], y = b.doc[tri[0]], c = x == null ? 1 : y == null ? -1 : x < y ? -1 : x > y ? 1 : 0; return tri[1] === "desc" ? -c : c; });
        if (max) l = l.slice(0, max);
        return Promise.resolve(l);
      },
      lire: function (table, id) { var d = (tables[table] || {})[id]; return Promise.resolve(d ? { id: id, doc: d, version: 1 } : null); },
      ecrire: function (table, id, patch, remplacer) {
        tables[table] = tables[table] || {};
        var d = tables[table][id];
        if (!d && !remplacer) return Promise.reject(new Error("document absent : " + table + "/" + id));
        tables[table][id] = remplacer ? Object.assign({ id: id }, patch) : Object.assign({}, d, patch);
        return Promise.resolve(tables[table][id]);
      },
      personnes: function (ids) { var o = {}; ids.forEach(function (i) { o[i] = { name: i === "u_apercu" ? "toi" : "Quelqu’un" }; }); return Promise.resolve(o); }
    };
  }

  /* ---------- la base imitée ---------- */
  function creer(fond, identite) {
    var abonnes = [], minuteur = null;
    function Requete(table) { this.table = table; this.filtres = []; this.tri = null; this.max = null; }
    Requete.prototype.where = function (c, op, v) { this.filtres.push([c, op, v]); return this; };
    Requete.prototype.orderBy = function (c, dir) { this.tri = [c, dir === "desc" ? "desc" : "asc"]; return this; };
    Requete.prototype.limit = function (n) { this.max = n; return this; };
    Requete.prototype.get = function () { return fond.lister(this.table, this.filtres, this.tri, this.max).then(snapshotDocs); };

  function btnLien(txt, onglet, param) { return '<button type="button" class="lien" data-nav="' + onglet + '" data-param="' + esc(param || "") + '" style="border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-bottom:1px dotted var(--line-strong)">' + txt + '</button>'; }
  function pluriel(n, un, plusieurs) { return n + " " + (n > 1 ? plusieurs : un); }
  function nomsSources(ids) { var liste = (O.etat.etat.sources && O.etat.etat.sources.liste) || []; return (ids || []).map(function (id) { var s = liste.filter(function (x) { return x.id === id; })[0]; return s ? s.nom : id; }); }

  /* ---------- chips et lignes ---------- */
  /* le mot de confiance sur chaque fait : vert avec le nombre d'origines pour établi et recoupé, gris pour signalé, orange pour contesté */
  function nOrigines(f) { return nb(f.origines) || origines(f).length || 1; }
  function chipConfiance(f) {
    var c = confiance(f), mot = esc(P.LE[c]);
    if (c === "officiel" || c === "recoupe") return O.chip(mot + " · " + pluriel(nOrigines(f), "origine", "origines"), "good", c === "officiel" ? "source officielle du domaine lue directement" : "deux rédactions indépendantes au moins");
    if (c === "divergent") return O.chip(mot, "warn", "deux sources se contredisent, personne n’a tranché");
    if (c === "terrain") return O.chip(mot, "info", "constat de terrain envoyé sur Telegram, sans rédaction : visible en interne, attention au plus");
    return O.chip(mot, "", "une seule rédaction : on appelle avant de décider");
  }
  function chipStatut(f) {
    var st = statutFait(f), age = "";
    /* un état (route coupée, coupure en cours, avis, grève) encore actif porte son âge ; le mot de confiance ne bouge pas */
    if (genre(f) === "etat" && (f.statut || "actif") === "actif") age = chipAge(derniereLecture(f));
    if (st === "maj") return age + O.chip("🔁 mis à jour le " + esc(O.fmt.date(derniereMaj(f).date)), "info");
    if (st === "termine") return O.chip("✔️ terminé", "");
    if (st === "echu") return age + O.chip("⏳ échéance dépassée", "gold");
    return age;
  }
  function chipHumain(f) { return f.reclasse_par_humain ? O.chip("✏️ reclassé", "warn", "niveau fixé à la main") : ""; }
  /* le titre entier sur bureau (contrat §9 : titre + puce d'état) ; le titre court, une phrase complète, au téléphone et sur Telegram */
  function titreL(f) { return esc(estTel() ? (f.titre_court || f.titre) : (f.titre || f.titre_court)); }
  function ouvert(cle, id) { return O.prefs.get(cle, "") === id; }

  /* la raison du mot, en une ligne sous chaque fait fermé : « recoupé : L'Express, Midi », « signalé : une rédaction, lue via AllAfrica », « établi : OMH » ;
     lot 2 : un signalé cherché sans succès chez les autres rédactions l'écrit (« non repris par Midi, Tribune ») */
  function nonRepris(f) { var c = f.confirmation; if (!c || c.recoupe_le || !(c.non_repris_par || []).length || nb(c.passages) < 2) return ""; return " · non repris par " + c.non_repris_par.join(", ") + " (" + nb(c.passages) + " passages)"; }
  function sousLigne(f, span) { var t = span ? 'span class="m" style="display:block"' : 'div class="m"'; return '<' + t + '>' + esc(motConf(f)) + ' : ' + esc(raisonConf(f, true) + nonRepris(f)) + '</' + (span ? "span" : "div") + '>'; }
  /* lot 2 : la cote de départ d'une source (A officiel, B rédaction avec texte, C relais ou flux sans texte, D nouvelle), lue dans etat/sources ; un service joint ou un constat n'en ont pas */
  function coteSrc(s) {
    if (!s) return "";
    if (s.type === "appel") return ' <span class="dim small">service</span>';
    if (s.type === "terrain" || /^terrain:\/\//.test(String(s.url || ""))) return ' <span class="dim small">terrain</span>';
    var liste = (O.etat.etat.sources && O.etat.etat.sources.liste) || [], n1 = String(s.nom || "").toLowerCase(), n2 = String(s.origine || "").toLowerCase();
    var x = liste.filter(function (y) { var n = String(y.nom || "").toLowerCase(); return n && (n === n1 || n === n2); })[0];
    return x && x.cote ? ' <span class="dim small" title="cote de la source : A officiel, B rédaction avec texte, C relais ou flux sans texte, D nouvelle">cote ' + esc(x.cote) + '</span>' : "";
  }
  /* lot 2 : où en est la recherche de confirmation d'un signalé ou d'un constaté (routine, entre deux passages ; ou appel depuis la page) */
  function rechercheConf(f) {
    var c = f.confirmation; if (!c) return "";
    if (c.recoupe_le) return "Confirmation trouvée le " + O.fmt.date(c.recoupe_le) + (c.par_service ? " par " + c.par_service : "") + (c.cherchee_depuis ? ", cherchée depuis le " + O.fmt.date(c.cherchee_depuis) : "") + ".";
    var n = nb(c.passages), qui = (c.non_repris_par || []).join(", ");
    return "Recherche de confirmation : " + (n ? n + " passage" + (n > 1 ? "s" : "") : "en cours") + (c.cherchee_depuis ? " depuis le " + O.fmt.date(c.cherchee_depuis) : "") + (qui ? " · non repris par " + qui : "") + ".";
  }
  function ligne(f, cle) {
    var on = ouvert(cle, f.id);
    return '<div class="l l2 clic' + (on ? " on" : "") + '" data-niveau="' + esc(f.niveau) + '" data-fait="' + esc(f.id) + '" data-cle="' + cle + '"><span class="pic">' + P.fait(f) + '</span>'
      + '<div><div class="t">' + titreL(f) + chipConfiance(f) + chipStatut(f) + chipHumain(f) + '</div>' + sousLigne(f) + '</div>'
      + '<span class="s">' + O.fmt.dateHtml(f.date_fait) + ' · ' + esc(origine(f)) + '</span></div>' + (on ? detail(f, cle) : "");
  }
  function ligneU(f, cle, etat) {
    var on = ouvert(cle, f.id), dp = etat.etat.dernier_passage || {};
    var tg = f.alerte_envoyee ? "📱 Telegram " + esc(O.fmt.heure(f.alerte_envoyee)) : dp.telegram === "absent" ? "📱 Telegram absent" : "📱 pas encore envoyé";
    return '<div class="l l2 clic' + (on ? " on" : "") + '" data-niveau="' + esc(f.niveau) + '" data-fait="' + esc(f.id) + '" data-cle="' + cle + '"><span class="pic">' + P.fait(f) + '</span>'
      + '<div><div class="t">' + titreL(f) + chipConfiance(f) + chipStatut(f) + chipHumain(f) + '</div><div class="m">' + esc(f.lieu || "") + (f.impact_parc ? ' · ' + esc(phrase1(f.impact_parc, 150)) : "") + '</div>' + sousLigne(f) + '</div>'
      + '<span class="s">' + O.fmt.dateHtml(f.date_fait) + ' · ' + esc(origine(f)) + '<br>' + tg + '</span></div>' + (on ? detail(f, cle) : "");
  }

  /* la raison du mot, dérivée des champs existants (rien n'est écrit en base) */
  var SERVICES = /OMH|hydrocarbures|Météo|JIRAMA|BNGRC|Primature|Douanes|minist|Autorité|APMF|INSTAT|Banky|BFM|gouv/i;
  function estOfficielle(s) {
    var liste = (O.etat.etat.sources && O.etat.etat.sources.liste) || [], n = srcCourt(s.origine || s.nom);
    if (liste.some(function (x) { return x.type === "officiel" && n && srcCourt(x.nom) === n; })) return true;
    return SERVICES.test(String(s.origine || "") + " " + String(s.nom || ""));
  }
  var RELAIS = { "allafrica.com": "AllAfrica", "cycloneoi.com": "CycloneOI", "taratra.mg": "Taratra" };
  function relaisNom(s) {
    var m = /\bvia\s+(.+)$/i.exec(String(s.nom || "")); if (m) return m[1].replace(/\)\s*$/, "").trim();
    var d = O.domaine(s.url).replace(/^fr\./, ""); return RELAIS[d] || d || "un relais";
  }
  var CHAMPS_DIV = { chiffre: "chiffre", date: "date", lieu: "lieu" };
  /* un document lu en base est une donnée : seuls les champs propres de CHAMPS_DIV (jamais le prototype), seules les valeurs {valeur, source} en chaîne ou nombre */
  function nomChamp(d) { return d && Object.prototype.hasOwnProperty.call(CHAMPS_DIV, d.champ) ? CHAMPS_DIV[d.champ] : "valeur"; }
  function texteVal(x) { return typeof x === "string" ? x : (typeof x === "number" && isFinite(x)) ? String(x) : ""; }
  function valeursDiv(d) { return (d && Array.isArray(d.valeurs) ? d.valeurs : []).filter(function (v) { return v && typeof v === "object"; }); }
  function divergences(f) { return Array.isArray(f.divergences) ? f.divergences.filter(function (d) { return d && typeof d === "object" && valeursDiv(d).length; }) : []; }
  function raisonConf(f, court) {
    var c = confiance(f), srcs = f.sources || [];
    if (c === "officiel") { var off = srcs.filter(estOfficielle)[0] || srcs[0]; return off ? srcCourt(off.origine || off.nom) : "service officiel"; }
    if (c === "recoupe") { var o = origines(f); return o.length ? o.join(", ") : pluriel(nOrigines(f), "origine", "origines"); }
    if (c === "divergent") {
      var dv = divergences(f).map(function (d) { return nomChamp(d) + " : " + valeursDiv(d).map(function (v) { return (texteVal(v.valeur) || "—") + (texteVal(v.source) ? " (" + srcCourt(v.source) + ")" : ""); }).join(" / "); });
      return dv.length ? dv.join(" ; ") : "deux sources se contredisent, personne n’a tranché";
    }
    if (c === "terrain") { var st = srcs[0] || {}; return "constat de terrain sur Telegram" + (st.date_pub ? " le " + O.fmt.date(st.date_pub) : "") + ", aucune rédaction"; }
    var s0 = srcs[0] || {}, parts = ["une rédaction" + (!court && origine(f) ? " (" + origine(f) + ")" : "")];
    if (s0.relais) parts.push("lue via " + relaisNom(s0));
    if (srcs.some(function (s) { return s && s.extrait_verifie === false; })) parts.push(court ? "amorcé depuis le pilote" : "amorcé depuis le pilote, extrait non vérifié");
    return parts.join(", ");
  }
  function blocDivergences(f) {
    var dv = divergences(f); if (!dv.length) return "";
    var html = '<div class="titre-maj">Sources en désaccord</div><div class="maj" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><span class="dim small">source</span><span class="dim small">valeur</span></div>';
    dv.forEach(function (d) {
      html += '<div class="maj" style="grid-template-columns:minmax(0,1fr)"><span class="small"><b>' + esc(nomChamp(d)) + '</b></span></div>';
      valeursDiv(d).forEach(function (v) { html += '<div class="maj" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)"><span>' + esc(srcCourt(texteVal(v.source)) || "—") + '</span><span>' + esc(texteVal(v.valeur) || "—") + '</span></div>'; });
    });
    return html;
  }

  /* un fait déplié : résumé, impact, confiance, sources, mises à jour, échéance, boutons */
  function detail(f, cle) {
    var e = O.etat, html = '<div class="det" data-det="' + esc(f.id) + '">';
    html += '<div>' + esc(f.resume || "") + '</div>';
    if (f.impact_parc) html += '<div class="mt" style="margin-top:4px"><b>Pour un parc :</b> ' + esc(f.impact_parc) + '</div>';
    html += '<div class="mt" style="margin-top:6px"><b>Confiance :</b> ' + esc(motConf(f)) + ' — ' + esc(raisonConf(f)) + '</div>';
    var rc = rechercheConf(f); if (rc) html += '<div class="small dim">' + esc(rc) + '</div>';
    var srcs = (f.sources || []).map(function (s) {
      /* un relais s'affiche « AllAfrica (L'Express) » : le relais, puis la rédaction d'origine, sans répéter le nom ; la cote de départ de la source à côté (lot 2) */
      var u = O.lien(s.url), nom = s.relais ? esc(relaisNom(s)) + (s.origine ? ' <span class="dim">(' + esc(srcCourt(s.origine)) + ')</span>' : "") : esc(srcCourt(s.nom || s.origine || O.domaine(s.url) || "source"));
      return (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + nom + ' ↗</a>' : nom) + coteSrc(s) + (s.date_pub ? ' <span class="dim">' + esc(O.fmt.date(s.date_pub)) + '</span>' : "");
    });
    html += '<div class="li">'
      + '<span><b>Sources :</b> ' + (srcs.length ? srcs.join(" · ") : "aucune") + '</span>'
      + '<span><b>Date du fait :</b> ' + esc(O.fmt.date(f.date_fait)) + (f.date_precision === "publication" ? " (date de parution)" : f.date_precision === "semaine" ? " (à la semaine)" : "") + '</span>'
      + '<span><b>Thème :</b> ' + esc(P.LT[f.theme] || f.theme || "") + (f.theme2 ? ' · étiquette : ' + esc(P.LT[f.theme2] || f.theme2) : "") + '</span>'
      + '<span><b>Zone :</b> ' + ((f.zones || []).length ? (f.zones || []).map(function (z) { return esc(nomZone(z)); }).join(", ") : esc(f.lieu || "—")) + '</span>'
      + (f.vu ? '<span><b>Vu :</b> oui</span>' : "")
      + (f.reclasse_par_humain ? '<span><b>Reclassé :</b> ' + esc(P.LN[f.reclasse_par_humain.niveau] || f.reclasse_par_humain.niveau) + ' le ' + esc(O.fmt.instant(f.reclasse_par_humain.quand)) + '</span>' : "")
      + (f.relecture ? '<span><b>Relecture :</b> ' + (f.relecture.verdict === "corrige" ? "corrigé" + (f.relecture.type ? " (" + esc(f.relecture.type) + ")" : "") : "confirmé") + (f.relecture.quand ? ' le ' + esc(O.fmt.date(f.relecture.quand)) : "") + (f.relecture.note ? ' · ' + esc(f.relecture.note) : "") + '</span>' : "")
      + '</div>';
    html += blocDivergences(f);
    if ((f.confirmations_humaines || []).length) {
      html += '<div class="titre-maj">Appels et vérifications</div>' + f.confirmations_humaines.map(function (c) {
        return '<div class="maj" style="grid-template-columns:64px minmax(0,1fr)"><span class="dim">' + esc(O.fmt.date(c.quand)) + '</span><span>' + (c.resultat === "confirme" ? "✅ confirmé" : c.resultat === "infirme" ? "✖ infirmé" : "— sans réponse") + ' par ' + esc(c.service || "?") + ' (' + (c.moyen === "appel" ? "appel" : c.moyen === "page" ? "page du service" : "terrain") + (c.officiel ? ", service du thème" : "") + ')' + (c.note ? ' · ' + esc(c.note) : "") + '</span></div>';
      }).join("");
    }
    if ((f.mises_a_jour || []).length) {
      html += '<div class="titre-maj">Mises à jour</div>' + f.mises_a_jour.map(function (m) {
        var u = O.lien(m.source_url);
        return '<div class="maj" style="grid-template-columns:64px minmax(0,1fr)"><span class="dim">' + esc(O.fmt.date(m.date)) + '</span><span>' + esc(m.texte || "") + (u ? ' <a class="dim small" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(O.domaine(u)) + ' ↗</a>' : "") + '</span></div>';
      }).join("");
    }
    if (f.echeance && f.echeance.date) html += '<div class="mt small"><b>⏰ Échéance ' + esc(O.fmt.date(f.echeance.date)) + (echu(f) ? " (dépassée)" : "") + ' :</b> ' + esc(f.echeance.libelle || "") + '</div>';
    if (e.peutEcrire) {
      var dis = e.ecritureEnCours ? " disabled" : "";
      if (menuReclasser && menuReclasser.id === f.id) {
        html += '<div class="btns" data-menu="' + esc(f.id) + '"><span class="small dim">Nouveau niveau :</span><select class="sel" data-champ="niveau">'
          + ["urgent", "attention", "info", "a_confirmer", "retire"].map(function (n) { var cf = confiance(f), ferme = n === "urgent" && (cf === "source_unique" || cf === "divergent"); return '<option value="' + n + '"' + (n === menuReclasser.niveau ? " selected" : "") + (ferme ? ' disabled title="' + esc(P.LE[cf]) + ' : jamais urgent"' : "") + '>' + (P.PN[n] || "") + ' ' + esc(P.LN[n]) + (ferme ? " (" + esc(P.LE[cf]) + " : jamais urgent)" : "") + '</option>'; }).join("")
          + '</select><input class="sel" data-champ="motif" maxlength="200" placeholder="motif court" value="' + esc(menuReclasser.motif) + '" style="width:220px;max-width:100%">'
          + '<button type="button" class="btn sm primary" data-act="valider-reclasser" data-fait="' + esc(f.id) + '"' + dis + '>Valider</button>'
          + '<button type="button" class="btn sm ghost" data-act="annuler-reclasser">Annuler</button></div>';
      } else if (menuConfirmer && menuConfirmer.id === f.id) {
        var ann = ((e.settings && e.settings.services) || O.servicesDefaut || {})[f.theme] || [];
        html += '<div class="btns" data-menu-conf="' + esc(f.id) + '" style="flex-wrap:wrap"><span class="small dim">Vérification auprès d’un service :</span>'
          + '<select class="sel" data-champ="moyen"><option value="appel">appel</option><option value="page">page du service</option><option value="terrain">terrain</option></select>'
          + '<input class="sel" data-champ="service" list="services-' + esc(f.id) + '" maxlength="80" placeholder="service joint (jamais une personne)" style="width:220px;max-width:100%"><datalist id="services-' + esc(f.id) + '">' + ann.map(function (s) { return '<option value="' + esc(s) + '">'; }).join("") + '</datalist>'
          + '<select class="sel" data-champ="resultat"><option value="confirme">confirmé</option><option value="infirme">infirmé</option><option value="sans_reponse">sans réponse</option></select>'
          + '<input class="sel" data-champ="note" maxlength="200" placeholder="note courte" style="width:220px;max-width:100%">'
          + '<button type="button" class="btn sm primary" data-act="valider-confirmer" data-fait="' + esc(f.id) + '"' + dis + '>Enregistrer</button><button type="button" class="btn sm ghost" data-act="annuler-confirmer">Annuler</button>'
          + '<span class="small dim" style="flex-basis:100%">Services du thème : ' + (ann.length ? esc(ann.join(", ")) : "aucun dans Réglages") + '. Un service du thème qui confirme rend le fait établi ; un autre service ou le terrain ajoute une origine ; infirmé rend le fait contesté.</span></div>';
      } else if (menuRelire && menuRelire.id === f.id) {
        html += '<div class="btns" data-menu-rel="' + esc(f.id) + '" style="flex-wrap:wrap"><span class="small dim">Relecture :</span>'
          + '<select class="sel" data-champ="verdict"><option value="confirme">confirmé tel quel</option><option value="corrige">corrigé</option></select>'
          + '<select class="sel" data-champ="type"><option value="">corrigé sur…</option>' + ["chiffre", "date", "lieu", "formulation", "attribution", "niveau"].map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join("") + '</select>'
          + '<input class="sel" data-champ="note" maxlength="300" placeholder="note courte" style="width:220px;max-width:100%">'
          + '<button type="button" class="btn sm primary" data-act="valider-relire" data-fait="' + esc(f.id) + '"' + dis + '>Enregistrer</button><button type="button" class="btn sm ghost" data-act="annuler-relire">Annuler</button></div>';
      } else {
        html += '<div class="btns"><button type="button" class="btn sm ghost" data-act="reclasser" data-fait="' + esc(f.id) + '"' + dis + '>Reclasser ▾</button>'
          + '<button type="button" class="btn sm ghost" data-act="confirmer" data-fait="' + esc(f.id) + '"' + dis + ' title="noter un appel, une page officielle ou un constat de terrain">Confirmer…</button>'
          + '<button type="button" class="btn sm ghost" data-act="relire" data-fait="' + esc(f.id) + '"' + dis + ' title="relecture : confirmé tel quel, ou corrigé sur un chiffre, une date, un lieu, la formulation, l’attribution ou le niveau">Relire…</button>'
          + (f.vu ? '<span class="small dim">✓ vu</span>' : '<button type="button" class="btn sm ghost" data-act="vu" data-fait="' + esc(f.id) + '"' + dis + '>Vu</button>')
          + '<button type="button" class="btn sm ghost" data-act="fermer" data-fait="' + esc(f.id) + '" data-cle="' + cle + '">Fermer ▴</button></div>';
      }
    }
    return html + '</div>';
  }

  /* ---------- Aujourd'hui ---------- */
  /* « n faits pour décider (établis ou recoupés) sur N · n signalés · n contestés » : le compteur de confiance, même phrase partout */
  function phraseConf(c) {
    return '<b>' + c.recoupes + ' fait' + (c.recoupes > 1 ? "s" : "") + ' pour décider</b> (établis ou recoupés) sur ' + c.total + ' · ' + c.signales + ' signalé' + (c.signales > 1 ? "s" : "") + ' · ' + c.contestes + ' contesté' + (c.contestes > 1 ? "s" : "");
  }
  function strip(etat, c) {
    var dp = etat.etat.dernier_passage, cr = dernierCr(etat), html = '<div class="strip">';
    if (dp && dp.fin) html += '<span>✓ <b>dernier passage ' + esc(O.fmt.instant(dp.fin)) + '</b></span><span>· prochain ' + esc(prochainPassage()) + '</span>';
    else html += '<span>aucun passage encore</span><span>· prochain ' + esc(prochainPassage()) + '</span>';
    if (cr) html += '<span>· point du soir du ' + esc(O.fmt.date(cr.date)) + (cr.envoye_le ? ' envoyé ' + esc(O.fmt.heure(cr.envoye_le)) : ' non envoyé') + '</span>';
    return html + '<span>· ' + (c.total ? phraseConf(c) + ' · 14 jours' : '0 fait sur 14 jours') + '</span></div>';
  }
  function depuisHier(etat, c) {
    var cr = dernierCr(etat), d = cr && cr.depuis_hier, hier = jourMoins(1), nb;
    if (d) nb = { nouveaux: (d.nouveaux || []).length, maj: (d.maj || []).length, termines: (d.termines || []).length, expires: (d.expires || []).length };
    else nb = { nouveaux: etat.faits.filter(function (f) { return String(f.cree_le || "").slice(0, 10) >= hier; }).length, maj: etat.faits.filter(function (f) { var m = derniereMaj(f); return m && String(m.date) >= hier; }).length, termines: 0, expires: 0 };
    var lien = function (txt, onglet, param) { return '<button type="button" class="lien" data-nav="' + onglet + '" data-param="' + esc(param || "") + '">' + txt + '</button>'; };
    var html = '<div class="depuis"><span>' + (cr ? "Depuis le point du " + esc(O.fmt.date(cr.date)) : "Depuis hier") + ' :</span>'
